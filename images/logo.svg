<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- White Circular Base -->
  <circle cx="250" cy="250" r="240" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Sun Rays (Yellow #eab308 / #facc15) -->
  <g stroke="#facc15" stroke-width="6" stroke-linecap="round">
    <line x1="250" y1="30" x2="250" y2="70" />
    <line x1="195" y1="45" x2="208" y2="82" />
    <line x1="305" y1="45" x2="292" y2="82" />
    <line x1="145" y1="78" x2="168" y2="108" />
    <line x1="355" y1="78" x2="332" y2="108" />
    <line x1="110" y1="125" x2="140" y2="145" />
    <line x1="390" y1="125" x2="360" y2="145" />
  </g>

  <!-- Rising Sun (Bright Sunrise Orange #ea580c / #f97316) -->
  <path d="M 140 185 A 110 110 0 0 1 360 185 Z" fill="#f97316"/>

  <!-- Open Book 3D Geometric Leaves (Leaf Green #65a30d & Deep Forest Green #15803d / #166534) -->
  <!-- Left Green Wing -->
  <polygon points="105,150 250,235 250,310 105,200" fill="#65a30d" />
  <polygon points="105,200 250,310 250,325 105,215" fill="#166534" />

  <!-- Right Green Wing -->
  <polygon points="395,150 250,235 250,310 395,200" fill="#4d7c0f" />
  <polygon points="395,200 250,310 250,325 395,215" fill="#14532d" />

  <!-- Inner Book Page Spine Highlight (White/Cream) -->
  <polygon points="112,154 250,236 388,154 250,225" fill="#ffffff" opacity="0.9" />

  <!-- Thin Stylized Line Accents across Book Tops -->
  <line x1="70" y1="185" x2="245" y2="280" stroke="#166534" stroke-width="5" stroke-linecap="round"/>
  <line x1="430" y1="185" x2="255" y2="280" stroke="#166534" stroke-width="5" stroke-linecap="round"/>

  <!-- Supporting Caring Hands (Orange #f97316) -->
  <!-- Left Hand -->
  <path d="M 98 215 C 105 270 120 310 165 350 C 175 358 190 358 205 350 C 205 310 170 280 155 260 C 145 245 130 230 110 220 Z" fill="#f97316" />
  <path d="M 165 350 L 165 355 C 165 355 175 358 205 355 L 205 350 Z" fill="#ea580c"/>

  <!-- Right Hand -->
  <path d="M 402 215 C 395 270 380 310 335 350 C 325 358 310 358 295 350 C 295 310 330 280 345 260 C 355 245 370 230 390 220 Z" fill="#f97316" />
  
  <!-- AESWS Stylized Handwritten Lettering -->
  <text x="250" y="430" font-family="'Space Grotesk', 'Comic Sans MS', sans-serif" font-weight="900" font-size="74" fill="#0f172a" text-anchor="middle" letter-spacing="4">AESWS.</text>
</svg>
